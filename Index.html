<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudei - Método Camadas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .layer-alert { background-color: #fee2e2; color: #991b1b; border-color: #f87171; }
        .layer-1 { background-color: #fef3c7; color: #92400e; border-color: #fbbf24; }
        .layer-2 { background-color: #e0f2fe; color: #075985; border-color: #38bdf8; }
        .layer-3 { background-color: #dcfce7; color: #166534; border-color: #4ade80; }
        .transition-transform { transition: transform 0.3s ease; }
    </style>
</head>
<body class="text-slate-800">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg"><i data-lucide="book-open" class="w-6 h-6 text-white"></i></div>
                <div>
                    <h1 class="text-xl font-bold">Estudei</h1>
                    <p class="text-xs text-slate-400">Método Camadas</p>
                </div>
            </div>
            <div class="flex flex-col items-end gap-1">
                <div id="cloud-status" class="flex items-center gap-2 text-xs font-medium px-3 py-1 rounded-full bg-slate-800 border border-slate-700">
                    <i data-lucide="loader-2" class="w-3 h-3 animate-spin text-blue-400"></i> A ligar...
                </div>
                <button onclick="gerenciarID()" class="text-[10px] text-slate-400 hover:text-white flex items-center gap-1 bg-slate-800/50 px-2 py-0.5 rounded">
                    ID: <span id="display-user-id" class="font-mono text-blue-300">...</span> <i data-lucide="key" class="w-3 h-3"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">
        
        <!-- Bússola do Ciclo de Estudos (Novo) -->
        <div class="bg-gradient-to-r from-slate-800 to-slate-900 rounded-xl shadow-md p-5 border border-slate-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <p class="text-blue-400 text-xs font-bold uppercase tracking-wider mb-1 flex items-center gap-1.5">
                    <i data-lucide="compass" class="w-4 h-4"></i> Foco do Ciclo Atual
                </p>
                <h2 id="ciclo-nome-atual" class="text-2xl font-bold text-white">Carregando...</h2>
            </div>
            <button onclick="girarCiclo()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-lg text-sm font-bold flex items-center gap-2 transition shadow-lg shrink-0">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i> Avançar Ciclo
            </button>
        </div>

        <!-- Dashboard / KPIs -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <p class="text-xs text-slate-500 font-medium uppercase tracking-wider mb-1">Questões</p>
                <p id="kpi-total" class="text-2xl font-bold text-slate-800">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <p class="text-xs text-slate-500 font-medium uppercase tracking-wider mb-1">Acerto Geral</p>
                <p id="kpi-percent" class="text-2xl font-bold text-blue-600">0%</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <p class="text-xs text-slate-500 font-medium uppercase tracking-wider mb-1">Domínio (Ciclo 3)</p>
                <p id="kpi-ciclo3" class="text-2xl font-bold text-green-600">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <p class="text-xs text-slate-500 font-medium uppercase tracking-wider mb-1">Alerta (< 60%)</p>
                <p id="kpi-alerta" class="text-2xl font-bold text-red-600">0</p>
            </div>
        </div>

        <!-- O Que Preciso Melhorar (Prioridades) -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 px-5 py-4 border-b border-slate-200 flex items-center gap-2">
                <i data-lucide="target" class="w-5 h-5 text-red-500"></i>
                <h2 class="font-semibold text-slate-800">O que preciso melhorar (Prioridades)</h2>
            </div>
            <div class="p-5">
                <div id="lista-prioridades" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <!-- Preenchido via JS -->
                </div>
            </div>
        </div>

        <!-- Disciplinas -->
        <div class="flex justify-between items-center mt-8 mb-4">
            <h2 class="text-lg font-bold text-slate-800">As Minhas Disciplinas</h2>
            <button onclick="adicionarDisciplina()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition shadow-sm">
                <i data-lucide="plus" class="w-4 h-4"></i> Nova Disciplina
            </button>
        </div>

        <div id="lista-disciplinas" class="space-y-4">
            <!-- Preenchido via JS -->
        </div>

    </main>

    <!-- Modal Lançar/Editar Questões -->
    <div id="modal-questoes" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden">
            <div class="bg-slate-50 px-5 py-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-800" id="modal-titulo">Lançar Questões</h3>
                <button onclick="fecharModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <input type="hidden" id="modal-disc-id">
                <input type="hidden" id="modal-assunto-id">
                <input type="hidden" id="modal-modo-edicao" value="false">
                
                <p id="modal-assunto-nome" class="text-sm font-medium text-slate-600 bg-slate-100 p-2 rounded text-center"></p>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1" id="label-feitas">Questões Feitas</label>
                        <input type="number" id="input-feitas" min="0" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-lg p-3 text-lg font-bold text-center focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1" id="label-erros">Quantas Errou?</label>
                        <input type="number" id="input-erros" min="0" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-lg p-3 text-lg font-bold text-center focus:ring-2 focus:ring-red-500 focus:outline-none">
                    </div>
                </div>
                <p id="modal-aviso-edicao" class="hidden text-xs text-orange-600 bg-orange-50 p-2 rounded text-center font-medium border border-orange-200">
                    Modo Edição: Os valores acima irão substituir o total atual.
                </p>
            </div>
            <div class="p-5 bg-slate-50 border-t border-slate-100 flex gap-3">
                <button onclick="fecharModal()" class="flex-1 bg-white border border-slate-300 text-slate-700 py-3 rounded-lg font-medium text-sm">Cancelar</button>
                <button onclick="salvarQuestoes()" id="btn-salvar-modal" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-medium text-sm transition">Salvar e Somar</button>
            </div>
        </div>
    </div>

    <!-- Script Principal -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACBwgANNYIGeZWL14U4v434gfDZUnfouI",
            authDomain: "app-de-estudo-81b2c.firebaseapp.com",
            projectId: "app-de-estudo-81b2c",
            storageBucket: "app-de-estudo-81b2c.firebasestorage.app",
            messagingSenderId: "420622769575",
            appId: "1:420622769575:web:b0631945d9ed6fe3e86a82"
        };

        let db = null;
        let docRef = null;
        let dadosLocais = { disciplinas: [], cicloIndex: 0 };
        let disciplinasAbertas = new Set();
        let unsubscribe = null;

        // Gestão de ID
        let userId = localStorage.getItem('estudei_tablet_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 6).toUpperCase();
            localStorage.setItem('estudei_tablet_id', userId);
        }
        document.getElementById('display-user-id').innerText = userId;

        window.gerenciarID = () => {
            const novoID = prompt(`O seu Código de Acesso atual é: ${userId}\n\nSe deseja importar dados de outro dispositivo, digite o código dele abaixo:`, userId);
            if (novoID && novoID.trim() !== "" && novoID !== userId) {
                userId = novoID.trim();
                localStorage.setItem('estudei_tablet_id', userId);
                document.getElementById('display-user-id').innerText = userId;
                dadosLocais = { disciplinas: [], cicloIndex: 0 }; 
                atualizarTela();
                iniciarFirebase(); 
            }
        };

        function iniciarFirebase() {
            try {
                if(!db) {
                    const app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                }
                if(unsubscribe) unsubscribe(); 
                
                docRef = doc(db, "dados_estudo", userId);
                mostrarStatus(false, "A ligar...");
                
                unsubscribe = onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        dadosLocais = docSnap.data();
                        if (dadosLocais.cicloIndex === undefined) dadosLocais.cicloIndex = 0; // fallback segurança
                        atualizarTela();
                        mostrarStatus(true, "Sincronizado");
                    } else {
                        salvarNaNuvem(dadosLocais);
                    }
                }, (error) => {
                    console.error("Erro Firebase:", error);
                    mostrarStatus(false, "Offline (Local)");
                    carregarLocal();
                });
            } catch (error) {
                mostrarStatus(false, "Offline (Local)");
                carregarLocal();
            }
        }
        
        iniciarFirebase();

        function mostrarStatus(online, texto) {
            const statusEl = document.getElementById('cloud-status');
            if(online) {
                statusEl.innerHTML = `<i data-lucide="cloud-check" class="w-3 h-3 text-green-400"></i> ${texto}`;
                statusEl.className = "flex items-center gap-2 text-[11px] font-medium px-2 py-0.5 rounded bg-green-900/30 text-green-100 border border-green-800/50";
            } else {
                statusEl.innerHTML = `<i data-lucide="cloud-off" class="w-3 h-3 text-slate-400"></i> ${texto}`;
                statusEl.className = "flex items-center gap-2 text-[11px] font-medium px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700";
            }
            lucide.createIcons();
        }

        function carregarLocal() {
            const salvo = localStorage.getItem(`estudei_dados_${userId}`);
            if (salvo) dadosLocais = JSON.parse(salvo);
            if (dadosLocais.cicloIndex === undefined) dadosLocais.cicloIndex = 0;
            atualizarTela();
        }

        async function salvarDados() {
            localStorage.setItem(`estudei_dados_${userId}`, JSON.stringify(dadosLocais));
            if (db && docRef) {
                try { await salvarNaNuvem(dadosLocais); } catch(e) {}
            }
            atualizarTela();
        }

        async function salvarNaNuvem(dados) {
            await setDoc(docRef, dados);
        }

        function calcularCamada(perc) {
            if (perc < 60) return { classe: 'layer-alert', selo: '🔴 Alerta', cor: 'text-red-600' };
            if (perc < 75) return { classe: 'layer-1', selo: '🟡 Ciclo 1', cor: 'text-yellow-600' };
            if (perc < 90) return { classe: 'layer-2', selo: '🔵 Ciclo 2', cor: 'text-blue-600' };
            return { classe: 'layer-3', selo: '🟢 Ciclo 3', cor: 'text-green-600' };
        }

        // --- Funções de Ciclo ---
        window.girarCiclo = () => {
            if (!dadosLocais.disciplinas || dadosLocais.disciplinas.length === 0) return;
            dadosLocais.cicloIndex = (dadosLocais.cicloIndex + 1) % dadosLocais.disciplinas.length;
            salvarDados();
        };

        // --- Funções de Interface ---
        window.toggleDisciplina = (id) => {
            if (disciplinasAbertas.has(id)) disciplinasAbertas.delete(id);
            else disciplinasAbertas.add(id);
            atualizarTela();
        };

        window.adicionarDisciplina = () => {
            const nome = prompt("Nome da Nova Disciplina:");
            if (!nome) return;
            const novoId = Date.now().toString();
            dadosLocais.disciplinas.push({ id: novoId, nome, assuntos: [] });
            disciplinasAbertas.add(novoId);
            salvarDados();
        };

        window.excluirDisciplina = (id, event) => {
            event.stopPropagation();
            if(confirm("Excluir esta disciplina e todos os assuntos?")) {
                dadosLocais.disciplinas = dadosLocais.disciplinas.filter(d => d.id !== id);
                disciplinasAbertas.delete(id);
                // Ajusta índice do ciclo se necessário
                if(dadosLocais.cicloIndex >= dadosLocais.disciplinas.length) dadosLocais.cicloIndex = 0;
                salvarDados();
            }
        };

        window.adicionarAssunto = (discId, event) => {
            event.stopPropagation();
            const nome = prompt("Nome do Assunto:");
            if (!nome) return;
            const disc = dadosLocais.disciplinas.find(d => d.id === discId);
            disc.assuntos.push({ 
                id: Date.now().toString(), 
                nome, 
                feitas: 0, 
                erros: 0,
                ultimaAtualizacao: null
            });
            disciplinasAbertas.add(discId);
            salvarDados();
        };

        window.abrirModalQuestoes = (discId, assuntoId, nomeAssunto, modoEdicao = false) => {
            document.getElementById('modal-disc-id').value = discId;
            document.getElementById('modal-assunto-id').value = assuntoId;
            document.getElementById('modal-modo-edicao').value = modoEdicao;
            document.getElementById('modal-assunto-nome').innerText = nomeAssunto;
            
            const disc = dadosLocais.disciplinas.find(d => d.id === discId);
            const assunto = disc.assuntos.find(a => a.id === assuntoId);

            if(modoEdicao) {
                document.getElementById('modal-titulo').innerText = "Corrigir Totais";
                document.getElementById('label-feitas').innerText = "Total Histórico (Feitas)";
                document.getElementById('label-erros').innerText = "Total Histórico (Erros)";
                document.getElementById('input-feitas').value = assunto.feitas;
                document.getElementById('input-erros').value = assunto.erros;
                document.getElementById('btn-salvar-modal').innerText = "Atualizar Valores";
                document.getElementById('modal-aviso-edicao').classList.remove('hidden');
            } else {
                document.getElementById('modal-titulo').innerText = "Lançar Nova Bateria";
                document.getElementById('label-feitas').innerText = "Questões Feitas Agora";
                document.getElementById('label-erros').innerText = "Quantas Errou Agora?";
                document.getElementById('input-feitas').value = '';
                document.getElementById('input-erros').value = '';
                document.getElementById('btn-salvar-modal').innerText = "Salvar e Somar";
                document.getElementById('modal-aviso-edicao').classList.add('hidden');
            }
            
            document.getElementById('modal-questoes').classList.remove('hidden');
        };

        window.fecharModal = () => {
            document.getElementById('modal-questoes').classList.add('hidden');
        };

        window.salvarQuestoes = () => {
            const discId = document.getElementById('modal-disc-id').value;
            const assuntoId = document.getElementById('modal-assunto-id').value;
            const isEdicao = document.getElementById('modal-modo-edicao').value === "true";
            
            const feitas = parseInt(document.getElementById('input-feitas').value) || 0;
            const erros = parseInt(document.getElementById('input-erros').value) || 0;

            if (erros > feitas || (!isEdicao && feitas <= 0)) {
                alert("Valores inválidos. Os erros não podem ser maiores que as feitas.");
                return;
            }

            const disc = dadosLocais.disciplinas.find(d => d.id === discId);
            const assunto = disc.assuntos.find(a => a.id === assuntoId);

            if(isEdicao) {
                assunto.feitas = feitas;
                assunto.erros = erros;
            } else {
                assunto.feitas += feitas;
                assunto.erros += erros;
                assunto.ultimaAtualizacao = new Date().toISOString(); // Grava a data automaticamente
            }
            
            fecharModal();
            salvarDados();
        };

        function atualizarTela() {
            let totalFeitas = 0, totalErros = 0, qtsCiclo3 = 0, qtsAlerta = 0;
            let todosAssuntos = [];
            const listaHTML = document.getElementById('lista-disciplinas');
            listaHTML.innerHTML = '';

            // Atualiza Ciclo Visual
            if (!dadosLocais.disciplinas || dadosLocais.disciplinas.length === 0) {
                document.getElementById('ciclo-nome-atual').innerText = "Adicione disciplinas...";
            } else {
                if (dadosLocais.cicloIndex >= dadosLocais.disciplinas.length) dadosLocais.cicloIndex = 0;
                document.getElementById('ciclo-nome-atual').innerText = dadosLocais.disciplinas[dadosLocais.cicloIndex].nome;
            }

            // Loop de Disciplinas
            (dadosLocais.disciplinas || []).forEach(disc => {
                let htmlAssuntos = '';
                let discFeitas = 0;
                let discErros = 0;
                
                disc.assuntos.forEach(assunto => {
                    discFeitas += assunto.feitas;
                    discErros += assunto.erros;
                    totalFeitas += assunto.feitas;
                    totalErros += assunto.erros;
                    
                    const acertos = assunto.feitas - assunto.erros;
                    const perc = assunto.feitas > 0 ? Math.round((acertos / assunto.feitas) * 100) : 0;
                    const camada = calcularCamada(perc);

                    if(assunto.feitas > 0) {
                        todosAssuntos.push({ ...assunto, discNome: disc.nome, perc, camada });
                        if(perc >= 90) qtsCiclo3++;
                        if(perc < 60) qtsAlerta++;
                    }

                    // Calcula o tempo desde a última resolução
                    let tempoTag = `<span class="text-slate-400">Nunca resolvido</span>`;
                    if (assunto.ultimaAtualizacao) {
                        const dias = Math.floor((new Date() - new Date(assunto.ultimaAtualizacao)) / (1000 * 60 * 60 * 24));
                        if (dias === 0) tempoTag = `<span class="text-green-600 font-medium">Resolvido hoje</span>`;
                        else if (dias === 1) tempoTag = `<span class="text-slate-500">Ontem</span>`;
                        else if (dias > 7) tempoTag = `<span class="text-orange-500 font-bold flex items-center gap-1"><i data-lucide="alert-circle" class="w-3 h-3"></i> Há ${dias} dias (Revisar)</span>`;
                        else tempoTag = `<span class="text-slate-500">Há ${dias} dias</span>`;
                    }

                    htmlAssuntos += `
                        <div class="flex flex-col md:flex-row md:items-center justify-between p-3 bg-white border border-slate-200 rounded-lg shadow-sm gap-3 hover:border-blue-300 transition-colors">
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-xs font-bold px-2 py-0.5 rounded-md border ${camada.classe}">${camada.selo}</span>
                                    <h4 class="font-medium text-slate-800 text-sm leading-tight">${assunto.nome}</h4>
                                </div>
                                <div class="text-[11px] text-slate-500 mt-1.5 flex flex-wrap items-center gap-2">
                                    <span>Feitas: <b>${assunto.feitas}</b></span> &bull; 
                                    <span>Erros: <b class="text-red-600/80">${assunto.erros}</b></span> &bull; 
                                    <span>Acertos: <b class="text-slate-700">${acertos}</b> <span class="${camada.cor} font-bold ml-1">(${perc}%)</span></span> &bull; 
                                    ${tempoTag}
                                </div>
                            </div>
                            <div class="flex gap-2 shrink-0">
                                <button onclick="abrirModalQuestoes('${disc.id}', '${assunto.id}', '${assunto.nome.replace(/'/g, "\\'")}', true)" class="text-slate-400 hover:text-orange-500 bg-slate-50 border border-slate-200 px-3 py-2 rounded-lg transition" title="Corrigir valores">
                                    <i data-lucide="pencil" class="w-4 h-4"></i>
                                </button>
                                <button onclick="abrirModalQuestoes('${disc.id}', '${assunto.id}', '${assunto.nome.replace(/'/g, "\\'")}', false)" class="bg-blue-50 text-blue-700 hover:bg-blue-100 px-4 py-2 rounded-lg text-sm font-semibold border border-blue-200 flex items-center gap-1 transition">
                                    <i data-lucide="plus" class="w-4 h-4"></i> Questões
                                </button>
                            </div>
                        </div>
                    `;
                });

                const discAcertos = discFeitas - discErros;
                const discPerc = discFeitas > 0 ? Math.round((discAcertos / discFeitas) * 100) : 0;
                const estaAberta = disciplinasAbertas.has(disc.id);
                
                listaHTML.innerHTML += `
                    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                        <div class="px-5 py-4 flex flex-col md:flex-row justify-between items-start md:items-center cursor-pointer hover:bg-slate-50 transition" onclick="toggleDisciplina('${disc.id}')">
                            <div class="flex items-center gap-3 w-full md:w-auto">
                                <i data-lucide="chevron-down" class="w-5 h-5 text-slate-400 transition-transform ${estaAberta ? 'rotate-180' : ''}"></i>
                                <div>
                                    <h3 class="font-bold text-slate-800 text-lg">${disc.nome}</h3>
                                    <p class="text-xs text-slate-500 mt-0.5">${disc.assuntos.length} assuntos &bull; Desempenho geral: <strong class="text-slate-700">${discPerc}%</strong></p>
                                </div>
                            </div>
                            <div class="flex gap-2 mt-3 md:mt-0 ml-8 md:ml-0">
                                <button onclick="adicionarAssunto('${disc.id}', event)" class="text-sm bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-300 px-3 py-1.5 rounded-md font-medium"><i data-lucide="plus" class="w-4 h-4 inline"></i> Assunto</button>
                                <button onclick="excluirDisciplina('${disc.id}', event)" class="text-slate-400 hover:text-red-500 bg-white border border-transparent hover:border-red-100 px-2 py-1.5 rounded-md"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                        <div class="${estaAberta ? 'block' : 'hidden'} bg-slate-50 border-t border-slate-200 p-4 space-y-2">
                            ${htmlAssuntos || '<p class="text-sm text-slate-400 text-center py-2">Sem assuntos cadastrados.</p>'}
                        </div>
                    </div>
                `;
            });

            // KPIs e Prioridades
            const totalAcertos = totalFeitas - totalErros;
            const percGeral = totalFeitas > 0 ? Math.round((totalAcertos / totalFeitas) * 100) : 0;
            document.getElementById('kpi-total').innerText = totalFeitas;
            document.getElementById('kpi-percent').innerText = percGeral + '%';
            document.getElementById('kpi-ciclo3').innerText = qtsCiclo3;
            document.getElementById('kpi-alerta').innerText = qtsAlerta;

            const prioridades = todosAssuntos.sort((a, b) => a.perc - b.perc).slice(0, 4);
            const prioHTML = document.getElementById('lista-prioridades');
            if(prioridades.length === 0) {
                prioHTML.innerHTML = `<p class="text-sm text-slate-500 col-span-2">Resolva questões para visualizar as prioridades.</p>`;
            } else {
                prioHTML.innerHTML = prioridades.map(p => `
                    <div class="flex justify-between items-center p-3 border border-slate-100 rounded-lg bg-white shadow-sm">
                        <div class="truncate pr-3">
                            <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">${p.discNome}</p>
                            <p class="text-sm font-medium text-slate-800 truncate leading-tight mt-0.5">${p.nome}</p>
                        </div>
                        <div class="text-right shrink-0">
                            <span class="text-sm font-bold ${p.camada.cor}">${p.perc}%</span>
                            <p class="text-[10px] text-slate-400">${p.camada.selo.split(' ')[1]}</p>
                        </div>
                    </div>
                `).join('');
            }

            lucide.createIcons();
        }
    </script>
</body>
</html>
